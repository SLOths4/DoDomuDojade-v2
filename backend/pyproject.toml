[project]
name = "dodomudojade"
version = "2.0.0.dev0"
description = "DoDomuDojadę: wirtualna tablica informacyjna (backend)"
license = "CC-BY-NC-4.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.10,<4",
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mwparserfromhell>=0.7.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "googleapiclient.*", "google.transit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: wymaga bazy PostgreSQL (zmienna TEST_DATABASE_URL)"]
